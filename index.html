<style>

    --creme: #fffbf0; --beige: #f6efd9; --sable: #eadfbf; --sable-fonce: #d9caa0;

    --ciel: #bfe7f7; --ciel-clair: #e8f7fc;
    --brun: #6b5440; --brun-doux: #9a8470;
    --soleil: #ffe08a; --corail: #f4a38c;
    --ombre: 0 4px 0 rgba(107, 84, 64, .12);
    --rond: 28px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { background: var(--ciel); }
  body {
    margin: 0; min-height: 100vh; color: var(--brun);
    font-family: 'Nunito', ui-rounded, system-ui, sans-serif; font-weight: 700;
    /* Ciel de journée (le cycle selon l'heure arrive à l'étape 7) */
    background:

      radial-gradient(90px 34px at 26% 82px, #fffb 60%, transparent 62%),
      radial-gradient(70px 28px at 80% 140px, #fff9 60%, transparent 62%),
      linear-gradient(var(--ciel) 0, var(--ciel-clair) 300px, var(--beige) 560px) no-repeat,
      var(--beige);
    padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* --- Connexion --- */
  #ecran-connexion { min-height: 90vh; display: grid; place-content: center; text-align: center; gap: 16px; }
  .logo { font-size: 44px; font-weight: 900; color: var(--feuille-fonce); letter-spacing: .5px; text-shadow: 0 3px 0 #fff; margin: 0; }
  #message { color: #b5523b; max-width: 320px; margin: 0 auto; }

  /* --- Mise en page --- */
  #app { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; padding-top: 12px; }
  @media (min-width: 960px) {
    #app { max-width: 1040px; grid-template-columns: 1fr 1fr; align-items: start; column-gap: 24px; }
  }
  .colonne { display: grid; gap: 16px; }
  .carte { background: var(--creme); border-radius: var(--rond); box-shadow: var(--ombre); padding: 16px; position: relative; }
  .etiquette {
    display: inline-block; background: var(--feuille); color: #fff; font-weight: 900; font-size: 15px;
    padding: 4px 14px; border-radius: 999px; margin: 0 0 12px; box-shadow: 0 3px 0 var(--feuille-fonce);
  }
  .sous-titre { font-size: 14px; color: var(--brun-doux); margin: 14px 0 8px; }

  /* --- En-tête : personnage et score --- */
  #date { text-align: center; font-size: 17px; color: var(--brun-doux); margin: 4px 0 0; text-transform: capitalize; }
  .entete { display: grid; grid-template-columns: 104px 1fr; gap: 14px; align-items: center; }
  #perso {
    width: 104px; height: 104px; border-radius: 50%; background: #fff; border: 4px solid var(--sable);
    display: grid; place-items: center; font-size: 48px; overflow: hidden;
    animation: rebond 2.4s ease-in-out infinite;
  }
  #perso img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes rebond { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  #bulle { background: #fff; border-radius: 20px; padding: 10px 14px; font-size: 15px; position: relative; margin-bottom: 8px; }
  .score-ligne { display: flex; align-items: baseline; gap: 6px; }
  #score { font-size: 46px; font-weight: 900; line-height: 1; color: var(--feuille-fonce); }
  .sur-100 { font-size: 18px; color: var(--brun-doux); }
  .libelle-score { font-size: 14px; color: var(--brun-doux); margin-left: auto; }
  .jauge { height: 18px; border-radius: 999px; background: var(--sable); margin: 10px 0 8px; overflow: hidden; box-shadow: inset 0 2px 0 rgba(107,84,64,.12); }
  #jauge-rempli {
    height: 100%; width: 0; border-radius: 999px;
    background: linear-gradient(90deg, var(--feuille), #a9de8c);
    box-shadow: inset 0 -3px 0 rgba(78,155,79,.35);

  #comparaison { font-size: 14px; color: var(--brun-doux); }
  #defi { margin-top: 12px; background: var(--soleil); border-radius: 16px; padding: 8px 12px; font-size: 14px; }

  /* --- Habitudes --- */
  .grille { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .grille.trois { grid-template-columns: repeat(3, 1fr); }
  .tuile {
    background: #fff; border: 3px solid var(--sable); border-radius: 22px; padding: 12px 8px 10px;
    display: grid; justify-items: center; gap: 2px; min-height: 104px; position: relative;
    box-shadow: 0 3px 0 var(--sable); transition: transform .12s, background .2s, border-color .2s;
    touch-action: manipulation;

  .tuile:active { transform: translateY(2px) scale(.97); box-shadow: 0 1px 0 var(--sable); }
  .tuile .emoji { font-size: 32px; line-height: 1.1; }
  .tuile .nom { font-size: 15px; }
  .tuile .info { font-size: 13px; color: var(--brun-doux); }
  .tuile.fait { background: var(--feuille-clair); border-color: var(--feuille); box-shadow: 0 3px 0 var(--feuille-fonce); }
  .tuile.fait .emoji { animation: saut .45s cubic-bezier(.34, 1.56, .64, 1); }
  .tuile.fait::after {
    content: '✓'; position: absolute; top: 6px; right: 8px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--feuille-fonce); color: #fff; font-size: 13px; display: grid; place-items: center; font-weight: 900;
  }
  .tuile.exclue { opacity: .55; border-style: dashed; }
  @keyframes saut { 0% { transform: scale(.7); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }

  /* --- Sommeil --- */
  .heures { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .heures label { display: grid; gap: 4px; font-size: 14px; color: var(--brun-doux); }
  .heures input {
    background: #fff; border: 3px solid var(--sable); border-radius: 18px; padding: 10px 12px; font-size: 22px;
    font-weight: 800; text-align: center; width: 100%; min-height: 54px; -webkit-appearance: none; appearance: none;
  }
  .heures.suggestion input { color: var(--brun-doux); border-style: dashed; }
  .sommeil-bas { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  #duree { font-size: 22px; font-weight: 900; }
  .pastille { border-radius: 999px; padding: 3px 10px; font-size: 13px; background: var(--sable); }
  .pastille.ok { background: var(--feuille-clair); color: var(--feuille-fonce); }
  .pastille.non { background: #fde3da; color: #b5523b; }
  #sommeil-serie { margin-left: auto; font-size: 14px; color: var(--brun-doux); }
  .bouton {
    background: var(--feuille); color: #fff; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 900;
    box-shadow: 0 3px 0 var(--feuille-fonce);
  }
  .bouton:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--feuille-fonce); }
  #sommeil-valider { width: 100%; margin-top: 12px; }

  /* --- Ménage --- */
  #menage-case { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; min-height: 64px; justify-items: start; }
  #menage-case .nom { flex: 1; }

  /* --- Tâches --- */
  .entete-taches { display: flex; align-items: center; justify-content: space-between; }
  #compteur-taches { font-size: 14px; color: var(--brun-doux); margin-bottom: 12px; }
  #form-tache { display: flex; gap: 8px; }
  #nouvelle-tache {
    flex: 1; min-width: 0; background: #fff; border: 3px solid var(--sable); border-radius: 999px; padding: 10px 16px; font-size: 16px;
  }
  #nouvelle-tache:focus, .heures input:focus { outline: none; border-color: var(--feuille); }
  #liste-taches { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
  #liste-taches button {
    width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: #fff; border: 0;
    border-radius: 18px; padding: 12px 14px; min-height: 48px;
  }
  .rond { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--sable-fonce); display: grid; place-items: center; font-size: 13px; color: #fff; }
  .tache-faite .rond { background: var(--feuille-fonce); border-color: var(--feuille-fonce); }
  .tache-faite .texte { text-decoration: line-through; color: var(--brun-doux); }

  /* --- Divers --- */

  #deconnexion { background: none; border: 0; color: var(--brun-doux); font-size: 14px; text-decoration: underline; padding: 8px; }

  #toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--brun); color: #fff; border-radius: 999px; padding: 10px 18px; font-size: 14px; max-width: calc(100% - 32px);
    box-shadow: var(--ombre);
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

<script>
// ===================== LOGIQUE DU SCORE =====================
// Fonctions pures : aucune lecture de l'heure système, aucun accès à Firestore ni au DOM.
// Tout ce qui dépend du moment présent (aujourd'hui) est passé en paramètre.

// Poids sur 100 (proposition à valider). Les repas valent 15 au total, 5 par repas.
const POIDS_DEFAUT = {
  sport: 25, sommeil: 25,
  eau: 15, petitDej: 5, dejeuner: 5, diner: 5,
  lecture: 8, meditation: 8,
  menage: 4,
};
const HABITUDES_JOUR = ['sommeil', 'eau', 'petitDej', 'dejeuner', 'diner', 'lecture', 'meditation'];
const OBJECTIF_SPORT = 3;           // séances par semaine
const SOMMEIL_MIN_MINUTES = 7 * 60; // sommeil validé à partir de 7 h

// --- Dates : clés « AAAA-MM-JJ » en date locale ---
// Seule cleDuJour lit l'heure locale ; tout le reste calcule en UTC sur les clés,
// donc un changement d'heure ne peut ni doubler ni sauter un jour.
function cleDuJour(date) {
  const p = n => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}`;
}
function ajouterJours(cle, n) {
  const [a, m, j] = cle.split('-').map(Number);
  const d = new Date(Date.UTC(a, m - 1, j + n));
  return d.toISOString().slice(0, 10);
}
function lundiDe(cle) {
  const [a, m, j] = cle.split('-').map(Number);
  const jourSemaine = new Date(Date.UTC(a, m - 1, j)).getUTCDay(); // 0 = dimanche
  return ajouterJours(cle, -((jourSemaine + 6) % 7));
}
function joursDeLaSemaine(lundi) {
  return Array.from({ length: 7 }, (_, i) => ajouterJours(lundi, i));
}

// --- Sommeil : durée à l'horloge, indépendante du changement d'heure ---
function dureeSommeilMinutes(coucher, reveil) {
  if (!coucher || !reveil) return null;
  const min = h => { const [hh, mm] = h.split(':').map(Number); return hh * 60 + mm; };
  return (min(reveil) - min(coucher) + 1440) % 1440;
}

// --- Valeur et exclusion d'une habitude un jour donné ---
function valeurHabitude(habitude, jour) {
  if (!jour) return 0;                                  // jour sans saisie = 0
  if (habitude === 'sommeil') {
    const d = dureeSommeilMinutes(jour.sommeil?.coucher, jour.sommeil?.reveil);
    return d !== null && d >= SOMMEIL_MIN_MINUTES ? 1 : 0;
  }
  return jour.habitudes?.[habitude] ? 1 : 0;
}
function estExclue(habitude, jour, semaine) {
  return !!(semaine?.exclusions?.includes(habitude) || jour?.exclusions?.includes(habitude));
}

// --- Score d'une journée (sert aussi à la couleur du calendrier en pixels) ---
// Retourne { score: 0..100 ou null si tout est exclu, poids: total des poids comptés }.
function scoreJour(jour, semaine, poids = POIDS_DEFAUT) {
  let num = 0, den = 0;
  for (const h of HABITUDES_JOUR) {
    if (estExclue(h, jour, semaine)) continue;
    num += poids[h] * valeurHabitude(h, jour);
    den += poids[h];
  }
  return { score: den ? (100 * num) / den : null, poids: den };
}

// --- Score de la semaine ---
// jours : { 'AAAA-MM-JJ': jour }, semaine : { menage, exclusions }.
// Jours comptés : ceux de la semaine compris entre dateDebut et aujourdhui inclus.
function calculerScoreSemaine({ lundi, jours = {}, semaine = {}, poids = POIDS_DEFAUT,
                                objectifSport = OBJECTIF_SPORT, dateDebut, aujourdhui }) {
  const comptes = joursDeLaSemaine(lundi)
    .filter(c => (!dateDebut || c >= dateDebut) && (!aujourdhui || c <= aujourdhui));

  // Partie quotidienne : chaque case pèse son poids, une case exclue disparaît.
  // Moyenne sur les jours qui ont au moins une habitude non exclue.
  let numJours = 0, denJours = 0, nbJours = 0;
  const scoresJours = {};
  for (const c of comptes) {
    const { score, poids: p } = scoreJour(jours[c], semaine, poids);
    scoresJours[c] = score;
    if (p === 0) continue;
    numJours += (score / 100) * p;
    denJours += p;
    nbJours++;
  }
  let num = nbJours ? numJours / nbJours : 0;
  let den = nbJours ? denJours / nbJours : 0;

  // Sport : objectif proratisé sur les jours comptés non exclus, arrondi (minimum 1), plafonné.
  const joursSport = comptes.filter(c => !estExclue('sport', jours[c], semaine));
  const seances = comptes.filter(c => jours[c]?.habitudes?.sport).length;
  let sport = null;
  if (joursSport.length) {
    const objectif = Math.max(1, Math.round(objectifSport * joursSport.length / 7));
    const taux = Math.min(seances, objectif) / objectif;
    sport = { seances, objectif, taux };
    num += poids.sport * taux;
    den += poids.sport;
  }

  // Ménage : case hebdomadaire.
  let menage = null;
  if (comptes.length && !semaine.exclusions?.includes('menage')) {
    menage = semaine.menage ? 1 : 0;
    num += poids.menage * menage;
    den += poids.menage;
  }

  return {
    score: den ? Math.round((100 * num) / den) : null,
    jours: comptes.length, scoresJours, sport, menage,
  };
}

// --- Série de jours consécutifs d'une habitude quotidienne ---
// Un jour exclu met la série en pause (ni +1, ni cassée).
// Aujourd'hui pas encore coché ne casse pas la série.
function serieJours(habitude, { jours = {}, semaines = {}, dateDebut, aujourdhui }) {
  let serie = 0;
  for (let c = aujourdhui, n = 0; (!dateDebut || c >= dateDebut) && n < 3660; c = ajouterJours(c, -1), n++) {
    const jour = jours[c];
    if (estExclue(habitude, jour, semaines[lundiDe(c)])) continue;
    if (valeurHabitude(habitude, jour)) serie++;
    else if (c !== aujourdhui) break;
  }
  return serie;
}

// --- Série du sport : semaines consécutives où l'objectif est atteint ---
// Semaine où le sport est exclu en entier : pause. Semaine en cours pas encore réussie : ne casse pas.
function serieSemainesSport({ jours = {}, semaines = {}, poids = POIDS_DEFAUT,
                              objectifSport = OBJECTIF_SPORT, dateDebut, aujourdhui }) {
  let serie = 0;
  const lundiCourant = lundiDe(aujourdhui);
  for (let lundi = lundiCourant, n = 0; (!dateDebut || ajouterJours(lundi, 6) >= dateDebut) && n < 530; lundi = ajouterJours(lundi, -7), n++) {
    const { sport } = calculerScoreSemaine({ lundi, jours, semaine: semaines[lundi], poids, objectifSport, dateDebut, aujourdhui });
    if (!sport) continue;
    if (sport.taux === 1) serie++;
    else if (lundi !== lundiCourant) break;
  }
  return serie;
}
// ===================== FIN LOGIQUE DU SCORE =====================

</script>

    onSnapshot(col('tasks'), s => {
      etat.taches = s.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) })); pret('taches');
    }, erreur),
  ];
}
function arreterEcoute() {
  desabonnements.forEach(f => f());
  desabonnements = [];
  Object.assign(etat, { uid: null, reglages: null, jours: {}, semaines: {}, taches: [], charge: new Set() });
}

// Firestore ne garantit pas l'ordre des clés d'un objet : on compare avec les clés triées.
const stable = o => JSON.stringify(o, (k, v) => v && typeof v === 'object' && !Array.isArray(v)
  ? Object.fromEntries(Object.entries(v).sort(([x], [y]) => x < y ? -1 : 1)) : v);

// Fige (ou recalcule après correction d'un jour passé) le score de chaque semaine terminée.
// N'écrit que si le résultat a changé, pour ne pas boucler avec onSnapshot.
function figerSemainesPassees() {
  const dateDebut = etat.reglages.dateDebut;
  const lundiCourant = lundiDe(etat.aujourdhui);
  for (let lundi = lundiDe(dateDebut); lundi < lundiCourant; lundi = ajouterJours(lundi, 7)) {
    const r = calculerScoreSemaine({ lundi, jours: etat.jours, semaine: etat.semaines[lundi], poids: poids(),
                                     objectifSport: objectifSport(), dateDebut, aujourdhui: etat.aujourdhui });
    const detail = { sport: r.sport, menage: r.menage, scoresJours: r.scoresJours };
    const deja = etat.semaines[lundi];
    if (deja?.fige && deja.score === r.score && stable(deja.detail) === stable(detail)) continue;
    setDoc(ref('weeks', lundi), { score: r.score, detail, fige: true, calculeLe: serverTimestamp() }, { merge: true }).catch(erreur);
  }
}

const ecrireJour = champs => setDoc(ref('days', etat.aujourdhui), { ...champs, majLe: serverTimestamp() }, { merge: true }).catch(erreur);
const ecrireSemaine = champs => setDoc(ref('weeks', lundiDe(etat.aujourdhui)), champs, { merge: true }).catch(erreur);

// ===================== INTERFACE =====================
const $ = id => document.getElementById(id);
const el = (balise, classe, texte) => {
  const e = document.createElement(balise);
  if (classe) e.className = classe;
  if (texte !== undefined) e.textContent = texte;
  return e;
};

const AFFICHAGE = {
  eau: ['💧', '2 L d’eau'], sport: ['🏃', 'Sport 30 min'], lecture: ['📖', 'Lecture'], meditation: ['🧘', 'Méditation'],
  petitDej: ['🥐', 'Petit-déj'], dejeuner: ['🥗', 'Déjeuner'], diner: ['🍲', 'Dîner'],
};
const minutesEnTexte = m => `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`;

function rendre() {
  const { aujourdhui, reglages, jours, semaines } = etat;
  const dateDebut = reglages.dateDebut;
  const lundi = lundiDe(aujourdhui);
  const jour = jours[aujourdhui];
  const semaine = semaines[lundi];
  const contexte = { jours, semaines, dateDebut, aujourdhui };

  $('ecran-connexion').hidden = true;
  $('chargement').hidden = true;
  $('app').hidden = false;

  const [a, m, j] = aujourdhui.split('-').map(Number);
  $('date').textContent = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(a, m - 1, j, 12));

  // Score de la semaine
  const r = calculerScoreSemaine({ lundi, jours, semaine, poids: poids(), objectifSport: objectifSport(), dateDebut, aujourdhui });
  $('score').textContent = r.score ?? '—';
  $('jauge-rempli').style.width = `${r.score ?? 0}%`;
  const precedente = semaines[ajouterJours(lundi, -7)];
  if (!precedente || precedente.score === null || precedente.score === undefined) $('comparaison').textContent = 'Première semaine';
  else if (r.score === null) $('comparaison').textContent = `Semaine dernière : ${precedente.score}`;
  else {
    const ecart = r.score - precedente.score;
    $('comparaison').textContent = ecart === 0 ? 'Pareil que la semaine dernière'
      : `${ecart > 0 ? '▲ +' : '▼ −'}${Math.abs(ecart)} par rapport à la semaine dernière`;
  }
  const defi = reglages.defiEnCours;
  $('defi').hidden = !defi;
  if (defi) $('defi').textContent = `🎯 Défi : ${defi.libelle}`;

  // Habitudes
  const tuile = h => {
    const [emoji, nom] = AFFICHAGE[h];
    const exclue = estExclue(h, jour, semaine);
    const fait = !exclue && !!jour?.habitudes?.[h];
    const b = el('button', `tuile${fait ? ' fait' : ''}${exclue ? ' exclue' : ''}`);
    b.setAttribute('aria-pressed', fait);
    b.append(el('span', 'emoji', emoji), el('span', 'nom', nom));
    let info;
    if (exclue) info = 'exclue · série en pause';
    else if (h === 'sport') {
      const serie = serieSemainesSport({ ...contexte, poids: poids(), objectifSport: objectifSport() });
      info = `${r.sport?.seances ?? 0}/${objectifSport()} · 🔥 ${serie} sem.`;
    } else info = `🔥 ${serieJours(h, contexte)}`;
    b.append(el('span', 'info', info));
    b.disabled = exclue;
    b.onclick = () => ecrireJour({ habitudes: { [h]: !fait } });
    return b;
  };
  $('grille-habitudes').replaceChildren(...['eau', 'sport', 'lecture', 'meditation'].map(tuile));
  $('grille-repas').replaceChildren(...['petitDej', 'dejeuner', 'diner'].map(tuile));

  // Sommeil : pré-rempli avec la dernière nuit saisie tant que celle d'aujourd'hui ne l'est pas.
  let sommeil = jour?.sommeil;
  const suggestion = !sommeil?.coucher || !sommeil?.reveil;
  const precedent = Object.keys(jours).filter(c => c < aujourdhui && jours[c].sommeil?.coucher && jours[c].sommeil?.reveil).sort().pop();
  if (suggestion) sommeil = precedent ? jours[precedent].sommeil : { coucher: '23:00', reveil: '07:00' };
  for (const champ of ['coucher', 'reveil']) if (document.activeElement !== $(champ)) $(champ).value = sommeil[champ];
  $('heures').classList.toggle('suggestion', suggestion);
  $('sommeil-valider').hidden = !suggestion;
  const exclu = estExclue('sommeil', jour, semaine);
  const duree = dureeSommeilMinutes(sommeil.coucher, sommeil.reveil);
  $('duree').textContent = suggestion ? 'À saisir' : minutesEnTexte(duree);
  $('sommeil-statut').className = `pastille${suggestion || exclu ? '' : duree >= SOMMEIL_MIN_MINUTES ? ' ok' : ' non'}`;
  $('sommeil-statut').textContent = exclu ? 'exclu · série en pause' : suggestion ? (precedent ? 'heures de la dernière nuit' : 'heures proposées')
    : duree >= SOMMEIL_MIN_MINUTES ? '✓ validé' : 'moins de 7 h';
  $('sommeil-serie').textContent = exclu ? '' : `🔥 ${serieJours('sommeil', contexte)}`;

  // Ménage
  const menageExclu = !!semaine?.exclusions?.includes('menage');
  const menageFait = !menageExclu && !!semaine?.menage;
  $('menage-case').className = `tuile${menageFait ? ' fait' : ''}${menageExclu ? ' exclue' : ''}`;
  $('menage-case').setAttribute('aria-pressed', menageFait);
  $('menage-case').disabled = menageExclu;
  $('menage-info').textContent = menageExclu ? 'exclu cette semaine' : menageFait ? '' : 'à faire cette semaine';
  $('menage-case').onclick = () => ecrireSemaine({ menage: !menageFait });

  // Tâches : les tâches cochées restent barrées jusqu'à la fin de leur semaine.
  const dansLaSemaine = t => t.fait && t.faitLe && lundiDe(t.faitLe) === lundi;
  const visibles = etat.taches.filter(t => !t.fait || dansLaSemaine(t))
    .sort((x, y) => (x.fait - y.fait) || ((x.creeLe?.toMillis?.() ?? 0) - (y.creeLe?.toMillis?.() ?? 0)));
  const faites = etat.taches.filter(dansLaSemaine).length;
  $('compteur-taches').textContent = `${faites} tâche${faites > 1 ? 's' : ''} faite${faites > 1 ? 's' : ''} cette semaine`;
  $('liste-taches').replaceChildren(...visibles.map(t => {
    const li = el('li', t.fait ? 'tache-faite' : '');
    const b = el('button');
    b.setAttribute('aria-pressed', !!t.fait);
    b.append(el('span', 'rond', t.fait ? '✓' : ''), el('span', 'texte', t.texte));
    b.onclick = () => setDoc(ref('tasks', t.id), { fait: !t.fait, faitLe: t.fait ? null : aujourdhui }, { merge: true }).catch(erreur);
    li.append(b);
    return li;
  }));
}

// Saisies du sommeil et des tâches
const enregistrerSommeil = () => {
  if ($('coucher').value && $('reveil').value) ecrireJour({ sommeil: { coucher: $('coucher').value, reveil: $('reveil').value } });
};
$('coucher').onchange = enregistrerSommeil;
$('reveil').onchange = enregistrerSommeil;
$('sommeil-valider').onclick = enregistrerSommeil;
$('form-tache').onsubmit = e => {
  e.preventDefault();
  const texte = $('nouvelle-tache').value.trim();
  if (!texte) return;
  $('nouvelle-tache').value = '';
  addDoc(col('tasks'), { texte, fait: false, faitLe: null, creeLe: serverTimestamp() }).catch(erreur);
};

let minuteurToast;
function erreur(e) {
  console.error(e);
  $('toast').textContent = e.code === 'permission-denied' ? 'Ce compte n’a pas accès à Respawn.' : `Pas enregistré : ${e.message}`;
  $('toast').hidden = false;
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => { $('toast').hidden = true; }, 5000);
}

// Bascule du jour à minuit, heure locale. Vérifiée aussi au retour sur l'app
// (iPhone en veille, onglet en arrière-plan), car un minuteur peut être retardé.
function verifierJour() {
  const cle = cleDuJour(new Date());
  if (cle === etat.aujourdhui) return;
  etat.aujourdhui = cle;
  if (etat.charge.size === 4) { figerSemainesPassees(); rendre(); }
}
(function planifierMinuit() {
  const n = new Date();
  const minuit = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1); // minuit local, changement d'heure compris
  setTimeout(() => { verifierJour(); planifierMinuit(); }, minuit - n + 500);
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden) verifierJour(); });
window.addEventListener('focus', verifierJour);

// ===================== INTERFACE (connexion) =====================
// Bouton « Se connecter avec Google » (Google Identity Services) puis signInWithCredential :
// évite les popups et redirections Firebase, peu fiables sur iPhone en mode écran d'accueil.
const attendreGoogle = () => new Promise(ok => {
  const t = setInterval(() => { if (window.google?.accounts?.id) { clearInterval(t); ok(); } }, 100);
});
attendreGoogle().then(() => {
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: async ({ credential }) => {
      try { await signInWithCredential(auth, GoogleAuthProvider.credential(credential)); }
      catch (e) { $('message').textContent = 'Connexion impossible : ' + e.message; }
    },
  });
  google.accounts.id.renderButton($('bouton-google'), { theme: 'outline', size: 'large', shape: 'pill', locale: 'fr' });
});

onAuthStateChanged(auth, u => {
  arreterEcoute();
  if (u) { $('chargement').hidden = false; ecouter(u.uid); }
  else { $('app').hidden = true; $('chargement').hidden = true; $('ecran-connexion').hidden = false; }
});
$('deconnexion').onclick = () => signOut(auth);
</script>
